{
    display: flex;
    height: 100vh;
}

.content 
{
    margin-left: calc(17.5% + 2rem);
    width: 100%;
    max-width: calc(82.5% - 2rem);
    display: flex;
    flex-direction: column;
 
    position: relative;
    z-index: 10;
    
}

.sm-content 
{
    margin: 1rem auto 2rem auto;
    
    width: 100%;
    max-width: 90%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 2rem;
    padding: 2rem;
}

.dashboard .left-container 
{
    flex: 2 1;
    display: flex;
}

.dashboard .left-container .new-appointments
{
    background: var(--over-color);
    width: 100%;
    border-radius: 14px;
    padding: 2rem 0 0 2rem;
    margin: 0rem auto 5rem;
    max-height: 80vh;
    overflow-y: scroll;
}

.dashboard .left-container .new-appointments .message h2
{
    color: var(--text-color);
    font-size: 35px;
    font-family: "Source Sans Pro";
    text-align: center;
    margin: 2rem 0;
    margin-left: -2rem;
    font-weight: bolder;
}

.dashboard .left-container .new-appointments .title,
.dashboard .right-container .doctors .title
{
    font-size: 20px;
    color: #fff;
    font-weight: 600;
}

.dashboard .left-container .new-appointments .first-row,
.dashboard .right-container .doctors .first-row
{
    display: flex;
    width: 90%;
    background: var(--over-difference-color);
    justify-content: space-between;
    align-items: center;
    margin: 1rem 0;
    border-radius: 28px;

}

.dashboard .left-container .new-appointments .first-row
{
    padding: 0 1.25rem;
}

.dashboard .left-container .new-appointments .row,
.dashboard .right-container .doctors .doctor
{
    display: flex;
    width: 90%;
    align-items: center;
  
    margin: 1rem;
    border-bottom: 2px solid var(--over-difference-color);
    color: var(--text-color);
    
  
}

.dashboard .left-container .new-appointments .row:last-child 
{
    border-bottom: none;   
}

.dashboard .left-container .new-appointments .first-row p,
.dashboard .right-container .doctors .first-row p
{
    color: #fff;
    width: 100%;
    display: flex;
    justify-content: center;
}

.dashboard .left-container .new-appointments .row div

{
    width: 20%;
    display: flex;
    justify-content: center;
}


.dashboard .left-container .new-appointments .row div p
{
    color: #c0d0ed;
    font-weight: normal;
    font-family: 'Inter';
}

.dashboard .left-container .new-appointments .row div.number-patient p
{
    color: var(--contrast-color-2);

}

.dashboard .left-container .new-appointments .row div.money p
{
    color: var(--contrast-color-2);
}

.dashboard .filter-container
{
    margin: calc(10vh + 2rem) auto 2rem auto;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    border: 1px solid var(--over-difference-color);
    border-radius: 10px;
}

.dashboard .filter-container .filter
{
  
    display: flex;
    justify-content: center;
    align-items: center;  
    height: 35px;
    border: 1px solid var(--over-difference-color);
    color: var(--text-color);
    padding: 0 1rem;
    
    cursor: pointer;
    transition: all 300ms ease-in-out;
}

.dashboard .filter-container .filter.active 
{
    background: var(--contrast-color);
}

.dashboard .filter-container .filter:first-child 
{
    border-top-left-radius: 10px;
    border-bottom-left-radius: 10px;
}

.dashboard .filter-container .filter:last-child 
{
    border-top-right-radius: 10px;
    border-bottom-right-radius: 10px;
}


.dashboard .data
{
    display: flex;
    width: 100%;
    max-width: 90%;
    justify-content: center;
    gap: 1rem;
    margin: 0rem auto;
}

.dashboard .data .data-container 
{
    display: flex;
    align-items: center;
    
    border-radius: 10px;
    box-shadow: 0 0 5px var(--text-color-4);
    background: rgba(0, 0, 0, .2);
    width: 100%;
    
    cursor: pointer;
    padding: .5rem 1.5rem;
}



.dashboard .data .data-container .image
{
    background: linear-gradient(var(--contrast-color-2), var(--contrast-color));
    border-radius: 16px;
    
}

.dashboard .data .data-container .image .data-icon
{
    width: 35px;
    height: 35px;
    color: #fff;
    padding: 1rem;
  
}

.dashboard .data .data-container .data-text 
{
    display: flex;
    flex-direction: column;

    flex: 1 1;
    justify-content: center;
    margin: 1rem 0 1rem 1.5rem;
}



.dashboard .data .data-container .data-text h2 
{
    color: var(--text-color-2);
   
}

.dashboard .data .data-container .data-text p
{
    color: var(--text-color);
}

.dashboard .right-container 
{
    flex: 1 1;
    height: 100%;
    
    width: 100%;
}

.dashboard .right-container .doctors .doctor 
{
    margin-left: 0;   
}

.dashboard .right-container .doctors .doctor:last-child
{
    border-bottom: none;
}   

.dashboard .right-container .doctors  
{
    background: var(--over-color);
    width: calc(100% - 2rem);
    border-radius: 14px;
    padding: 2rem 0 0 2rem;
    max-height: 80vh;
    overflow-y: scroll;
}

.dashboard .right-container .doctors .doctor div
{
    width: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.dashboard .right-container .doctors .doctor .status
{
    background: var(--over-color);
    border-radius: 60px;
    margin: .5rem auto;
    
}

.dashboard .right-container .doctors .doctor .status p
{
    font-weight: 500;
    font-family: "Inter";
    font-size: 16px;
}

.dashboard .right-container .doctors .doctor .status.on p
{
    color: #56C456;    
    
}


.dashboard .right-container .doctors .doctor .status.off p
{
    color: #F25F64;
}

@media only screen and (max-width: 1200px) {
    .content {
        margin-left: initial;
        width: 100%;
        max-width: 100%;
    }
}

@media only screen and (max-width: 1000px) {
    .data {
        flex-direction: column;
        align-items: center;
    }

    .data .data-container {
        width: 100%;
        
        max-width: 80%;
    }

    .sm-content 
    {
        flex-direction: column;
    }

    .dashboard .left-container
    {
        flex: 1 1;
        width: 100%;
    }

    .dashboard .left-container .first-row 
    {
        padding: 0;
    }

    .dashboard .left-container .new-appointments .message h2
    {
        font-size: 5vw;
        margin-inline: 0;
    }

    .dashboard .left-container .new-appointments 
    {
        padding-inline: 1rem;
    }

}

@media only screen and (max-width: 650px) {
    .data .data-container {
        width: 100%;
        
        max-width: 95%;
    }

    .sm-content
    {
       padding: 0;
    }

    .dashboard .left-container
    {

{
    background: var(--background-color);
    border-right: 1px solid rgba(255, 255, 255, .25);
    display: flex;
    
    flex-direction: column;
    gap: .35rem;
    padding: 2.5rem 1rem 0;
    position: fixed;
    height: 100vh;
    width: 100%;
    max-width: 17.5%;
    min-width: 225px;
    transition: all 500ms ease-in-out;
}

.navigation .patient-icon 
{
    width: 35px;
    height: 35px;
    fill: var(--text-color);
    margin-left: -6px;
}

.navigation .close-icon 
{
    display: none;
    background: var(--contrast-color);
    color: var(--text-color);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    padding: .5rem;
    position: absolute; 
    top: 10px;
    left: 10px;
    cursor: pointer;
}

.navigation > div:not(.logo)
{
    padding-left: 1rem;
}

.navigation .logo 
{
    width: "100%";
    margin-bottom: 2rem;
    display: flex;
    justify-content: center;
    align-items: center;

}

.navigation .logo img 
{
    width: 90%;
    height: auto;
}



.navigation > .item 
{
    display: flex;
    align-items: center;
    gap: .75rem;
    cursor: pointer;
    border-radius: 8px;
}

.navigation > .item .submenu-icon 
{
    margin-left: auto;
    margin-right: 15px;
    color: var(--text-color);
    cursor: pointer;
    width: 20px;
    height: 20px;
}

.navigation .sub-list:not(.active) 
{
    display: none;
}



.navigation .sub-list .item 
{
    display: flex;
    align-items: center;
    gap: .5rem;
    margin-left: 1rem;
    margin-top: -.5rem;
    margin-bottom: 1rem;
    border-radius: 8px;
    cursor: pointer;
    padding: 0 1rem;

}

.navigation .sub-list .item.highlight 
{
    background: var(--contrast-color);
}

.navigation .sub-list .item .dot 
{
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--text-color-3);
}
.navigation .sub-list .item p 
{
    color: var(--text-color);
    font-size: 20px;
}


.navigation .item:hover h3,
.navigation .item:hover .item-icon
{
    color: #fff;
}

.navigation .item.active 
{
    background: var(--contrast-color);
}


.navigation .item .item-icon 
{
    color: #AFB3BE;
    font-size: 24px;
    transition: all 350ms ease-in-out;

}

.navigation .item.active .item-icon 
{
    color: var(--text-color);
}

.navigation .item h3
{
    font-size: 22px;
    color: #7988A3;
    font-weight: 600;
    margin-left: 14px;
    transition: all 350ms ease-in-out;

}

.navigation .item.active h3 
{
    color: var(--text-color);
}

.navigation .settings 
{
    position: absolute; 
    bottom: 55px;
    display: flex;
    width: 100%;
    gap: .75rem;
    cursor: pointer;
}

.navigation .settings h3
{
    font-size: 18px;
    color: #7988A3;
    font-weight: 600;
    transition: all 350ms ease-in-out;
}

.navigation .settings.active h3
{
    color: var(--text-color);
}

.navigation .settings:hover h3
{
    color: #fff;
}

.navigation .settings .item-img 
{
    fill: #000;
    color: #000;
}

@media only screen and (max-width: 1200px) {
    .navigation {
        left: -100%;
        z-index: 11;
        
    }

    .navigation.active {
        left: 0;
    }

    .navigation.active .close-icon {
        display: block;
    }
}

{
    width: 100%;
    max-width: calc(82.5% - 2rem);

    height: 10vh;
    display: flex;
    align-items: center;
    background: var(--background-color);
    position: fixed;
    z-index: 1000;
    justify-content: space-between;
    border-left: 1px solid rgba(255, 255, 255, .25);
}

.header .navigation-icon
{
    display: none;
    position:absolute;
    left: 20px;
    font-size: 35px;
    border-radius: 50%;
    
    color: var(--contrast-color);
}

.header .searchbar-container
{
    display: flex;
    align-items: center;
    
    height: 100%;
    margin-left: 60px;
}

.header .searchbar 
{
    border: 2px solid rgba(255, 255, 255, 0.272);
    border-radius: 25px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0 1rem;
    display: none;
}

.header .searchbar input
{
    border: none;
    outline: none;
    background: transparent;
    width: 270px;
    height: 42px;
    padding-left: .75rem;
    color: rgba(255, 255, 255, .8);
    font-size: 18px;
    font-family: "Source Sans Pro";
 
}

.header .searchbar .search-icon 
{
    font-size: 18px;
    color: rgba(255, 255, 255, .45);
}

.header .account-details
{
    
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-right: 1.5rem;
   
}

.header .account-details .notifications
{
    background: rgba(0, 0, 0, .3);
    border-radius: 50%;
    position: relative;
    cursor: pointer;
}

.header .account-details .notifications .notification-signal
{
    position: absolute;
    right: 15px;
    top: 10px;
    width: 10px;
    height: 10px;
    background: crimson;
    border-radius: 50%;
}


.header .account-details .notifications .notification-icon 
{
    padding: .7rem .8rem;
    font-size: 22px;
    color: var(--contrast-color);
}

.header .account-details .account-photo 
{
    display: flex;
    justify-content: center;
    align-items: center;

   
}

.header .account-details .account-photo .account-icon 
{
    font-size: 25px;
    background: rgba(0, 0, 0, .3);
    padding: .7rem .8rem;
    border-radius: 50%;
    color: var(--contrast-color);
    cursor: pointer;    
}

.header .account-details .account-photo img 
{
    width: 100%;
    max-width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 50%;
    cursor: pointer;
    
}

.header .account-details .account-name 
{
    font-size: 22px;
    color: #fff;
    cursor: pointer;
}

.header .account-details .account-info-icon
{
    color: rgb(148, 151, 158);
    cursor: pointer;
    transition: all 350ms ease-in-out;
    font-size: 16px;
}

.header .account-details .account-info-icon:hover
{
    transform: translateY(5px);
}

@media only screen and (max-width: 1200px) {
    .header {
        width: 100%;
        max-width: 100%;
    }

    .header .navigation-icon {
        display: block;
    }

{
  
    width: 100%;
    max-width: 100%;

    
}

.admin > *:not(.message)
{
    max-width: 90%;
    margin: 1rem auto;
}

.admin .message 
{
    width: 100%;   
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgb(25, 147, 25);
    margin-top: 1rem;
    height: 40px;
    border-radius: 50px;
}

.admin .message p 
{
    text-align: center;
}

.admin .title 
{
    color: var(--contrast-color);
    text-align: center;
    font-size: 50px;
}

.admin p 
{
    color: #fff;
    font-size: 20px;
}

.admin .create-organisation,
.admin .create-user
{
    width: calc(92.5%);
    background: var(--dark-color);
    height: 50px;
    display: flex;
    padding-left: 1rem;
    align-items: center;
    border-radius: 30px;
    cursor: pointer;
    margin: 0 auto;
}

.admin .create-user
{
    background: rgba(125, 125, 255, .15);
    margin-bottom: 1rem;
}

.admin .create-organisation p,
.admin .create-user p
{
    color: #96a7c7;
    margin-left: .5rem;
  
}

.admin .create-organisation .plus-icon,
.admin .create-user .plus-icon
{
    color: var(--contrast-color);
    font-size: 22.5px;
}


.admin .organisation 
{
    width: 100%;
    max-width: 90%;
    margin: 2rem auto;
    background: var(--dark-color);
    border-radius: 20px;
    padding: 1rem;
    position: relative;
  
}

.admin .organisation > .option
{
    position: absolute;
    top: 15px;
    right: 25px;
   
    
    font-size: 34px;
    color: var(--text-color-2);
    cursor: pointer;
}

.admin .organisation .options 
{
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.admin .organisation .options-container 
{
    position: absolute;
    top: 90%;
    background: #000;
    right: 30%;
    min-height: 60px;
    opacity: 0;
    transition: all 350ms ease-in-out;
    display: flex;
    justify-content: center;
    align-items: center;
}

.admin .organisation .options-container.active 
{
    opacity: 1;
}

.admin .organisation .options-container.active .option-item
{
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    width: 250px;
   
    padding-inline: 20px;
}

.admin .organisation .options-container.active .option-item p
{
    font-size: 100%;
    font-family: "Inter";
    color: var(--text-color);
    font-size: 18px;
    width: 100%;
}

.admin .organisation .options-container.active .option-item .icon 
{
    color: var(--contrast-color);
    font-size: 20px;
}


.admin .organisation .user 
{


}

.admin .organisation .line 
{
    width: 100%;
    max-width: 92.5%;
    margin: .25rem auto 1.5rem;
    height: 1.5px;
    background: rgba(125, 125, 255, .5);
}

.admin .organisation .first-row,
.admin .organisation .user 
{
    display: grid;
    justify-content: center;
    grid-template-columns: 1fr 1fr 1fr 1fr;
}

.admin .organisation .first-row p,
.admin .organisation .user p
{
    width: 100%;
    text-align: center;
}

.admin .organisation .user .option-icon
{
    width: 100%;
    align-self: center;
    font-size: 24px;
    color: var(--text-color-3);
    cursor: pointer;
    position: relative;
    z-index: 100000;
}

.admin .organisation .user p
{
    color: var(--contrast-color);
}

.admin .organisation .organisation-container
{
    display: flex;
    justify-content: center;
    align-items: center;
}

.admin .organisation .organisation-container h2
{
    color: #fff;
    text-align: center;
    font-size: 30px;

{
    display: flex;
    
 
    min-height: 100vh;
 
}



.patients .content .title
{
    font-size: 40px;
    margin: 20vh 5rem 2rem;
    text-align: center;
    color: rgba(255, 255, 255, .8);
  
}

.patients .content .search-container 
{
    width: 100%;
    max-width: 25%;
    height: 35px;
    margin: 1rem 5rem;
    display: flex;
  
    align-items: center;
    border: 2px solid rgba(255, 255, 255, .1);
    border-radius: 45px;
    padding: .25rem 1rem;

}

.patients .content .search-container input 
{
    width: 100%;
    height: 100%;
    
  
    border: none;
    outline: none;
    background: transparent;
    color: #fff;
    font-size: 16px;
    font-family: "Inter";
}

.patients .content .search-container .search-icon
{
    font-size: 22px;
    color: var(--contrast-color);
    cursor: pointer;
}



.patients .content .patients-container 
{
   
    display: flex;
    justify-content: center;
    background: rgba(0, 0, 0, .3);
    align-items: center;
    flex-direction: column;
    margin: 0 5rem 0;
    border-radius: 20px;
    padding: 2rem;
}

.patients .content .patients-container .first-row 
{
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    background: var(--contrast-color);
    border-radius: 30px;
}

.patients .content .patients-container .row 
{
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, .1);
    margin: .75rem auto;
    position: relative;
}

.patients .content .patients-container .first-row div p 
{
    color: #fff;
    font-family: "Inter";
    font-weight: 600;
}

.patients .content .patients-container .first-row div,
.patients .content .patients-container .row div
{
    width: 25%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.patients .content .patients-container .row div p
{

    color: rgba(255, 255, 255, .75);
    font-size: 20px;
    font-family: "Inter";
    font-weight: 400;
}

.patients .content .patients-container .row div .column-icon 
{
    color: var(--contrast-color);
    font-size: 20px;
}

.content .add-button 
{
    position: fixed;
    right: 25px;
    bottom: 25px;
    width: 75px;
    height: 75px;
    background: var(--contrast-color);
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 50%;
    cursor: pointer;
}

.content .add-button .add-icon 
{
    font-size: 45px;
    color: rgba(255, 255, 255, .75);
}

.patients .content .patients-container h2.center 
{
    color: rgba(255, 255, 255, .65);
    font-size: 45px;
}

.patients .content .patients-container .row .column
{
}

.patients .content .patients-container .row .column .options-container 
{
    position: absolute;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    opacity: 0;
    bottom: -110px;
    right: -65px;
    font-size: 16px;
    width: 200px;
    z-index: -1;
    background: var(--dark-color);
    border-radius: 14px;
}

.patients .content .patients-container .row .column .options-container .option 
{
    display: flex;

    align-items: center;
    width: 100%;
    height: 100%;
    justify-content: space-around;
    align-content: center;
    cursor: pointer;
}

.patients .content .patients-container .row .column .options-container .option .option-icon 
{
    color: var(--contrast-color);
    font-size: 20px;
    width: 25%;
  
}

.patients .content .patients-container .row .column .options-container .option p 
{
    width: 75%;
}

.patients .content .patients-container .row .column .column-icon
{
    cursor: pointer;
}

.patients .content .patients-container .row .column .options-container.show 
{
    opacity: 1;
    z-index: 1;

.column .option-container 
{
    aspect-ratio: 1 / 1;
    background: var(--contrast-color);
    color: var(--text-color);
    border-radius: 8px;
    cursor: pointer;
}

.column .option-container .option-icon
{
    font-size: 18px;
}

.column .option-container:nth-child(2) 
{
    background: var(--contrast-color-2);
}

.column .option-container:nth-child(3) 
{
    background: var(--contrast-color-3);
}

.warning-container
{
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--over-color-2);
  
    z-index: 1000;
    display: flex;
    justify-content: center;
    align-items: center;
}

.warning-container .warning-card
{
    width: 100%;
    max-width: 350px;
    
    background: var(--dark-color);
    padding: .5rem;
    border: 1.5px solid var(--contrast-color);
    border-radius: 16px;
}

.warning-container .warning-card p
{
    text-align: center;
    font-family: "Inter";
    color: var(--text-color);
    font-size: 18px;
}


.warning-container .warning-card .buttons-warning
{
    display: flex;
    justify-content: center;
    align-items: center;
    gap: .5rem;
    width: 100%;
}

.warning-container .warning-card .buttons-warning button 
{
    flex: 1 1;
    background: var(--contrast-color);
    color: var(--text-color);
    border-radius: 10px;
    height: 40px;
    border: none;
    outline: none;
    font-size: 16px;
    font-family: "Inter";
    cursor: pointer;
}

.appointments .year-schedule .year-month-container 
{
    display: flex;
    flex-direction: column;
    width: 100%;
}

.appointments .year-schedule .month-data 
{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
   
    width: 100%;
    max-width: 100%;
 
}

.appointments .year-schedule .year-month-container .month-number 
{
    color: var(--contrast-color);
    font-size: 24px;
    margin-bottom: 0.5rem;
    cursor: pointer;
}

.appointments .year-schedule .year-month-container .month-data .month-day 
{
 
    display: flex;
    justify-content: center;
    align-items: center;
    height: 25px;
    width: 25px;
    border-radius: 50%;
    margin: .5rem 0;
    transition: all 350ms ease-in-out;
    
    
}

.appointments .year-schedule .year-month-container .month-data .month-day:hover 
{
    background: var(--contrast-color);
}

.appointments .year-schedule .year-month-container .month-day .day-number
{
    color: var(--text-color);
    cursor: pointer;
    font-size: 18px;
    font-family: "Inter";
    font-weight: 600;
    
    transition: all 350ms ease-in-out;

}

.appointments .appointment-details 
{
   
    display: none;
    
    
}

.appointments .appointment-details.active
{
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, .6);
    z-index: 102;
    display: flex;
    justify-content: center;
    

}

.appointments .appointment-details.active .appointment-details-card 
{
    width: 65%;
    
    background: var(--background-color);
    border-radius: 20px;
    margin-top: 15vh;
    position: relative;
   
}

.appointments .appointment-details.active .appointment-details-card .close-icon
{
    position: absolute;
    top: 10px;
    right: 17.5px;
    color: var(--contrast-color);
    font-size: 30px;
    cursor: pointer;
}

.appointments .appointment-details.active .appointment-details-card .appointment-details-title
{
    color: var(--text-color);
    text-align: center;
    font-family: "Source Sans Pro";
}

.appointments .appointment-details.active .appointment-details-card .appointment-details
{
    display: grid;
    grid-template-columns: 1fr 1fr;
    justify-content: center;
    gap: 1rem;
    align-items: center;
    margin: 0 1.5rem 2rem;
}



.appointments .appointment-details.active .appointment-details-card .appointment-details .label .option-btn
{
    display: flex;
   
    align-items: center;
    justify-content: center;
    min-width: 100%;
    border-radius: 32px;
    cursor: pointer;
    background:rgba(0, 0, 0, .6);
    border: none;
    outline: none;
    gap: 10px;
   
}

.appointments .appointment-details.active .appointment-details-card .appointment-details .label .option-btn p
{
    color: var(--contrast-color);
    font-size: 18px;
    
}

.appointments .appointment-details.active .appointment-details-card .appointment-details .label .option-btn .option-icon
{
    color: var(--contrast-color);
    font-size: 20px;
    
}

.appointments .appointment-details.active .appointment-details-card .appointment-details .label.one-row
{
    grid-column: 1 / -1;
    width: 100%;
}

.appointments .appointment-details.active .appointment-details-card .appointment-details .label .label-row
{
    display: flex;
    gap: 1rem;
}

.appointments .appointment-details.active .appointment-details-card .appointment-details .label .label-row .input 
{
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

.appointments .appointment-details.active .appointment-details-card .appointment-details .label .label-row .scale 
{
    position: absolute;
    right: 10px;
    display: flex;

}

.appointments .appointment-details.active .appointment-details-card .appointment-details .label .label-row .scale .scale-icon
{
    cursor: pointer;
    color: var(--contrast-color);

.appointments .appointment-details.active .appointment-details-card .appointment-details .label input,
.appointments .appointment-details.active .appointment-details-card .appointment-details .label select

.appointments .appointment-details.active .appointment-details-card .appointment-details .patient-list-container:not(.active)

.appointments .appointment-details.active .appointment-details-card .appointment-details .patient-list-container

    color: var(--text-color);
    
}   

.appointments .appointment-details.active .appointment-details-card .appointment-details .patient-list-container .line-patient

.appointments .appointment-details.active .appointment-details-card .appointment-details .patient-list-container .line-patient button

.appointments .appointment-details.active .appointment-details-card .appointment-details .patient-list-container .line-patient button:hover

.appointments .appointment-details.active .appointment-details-card .appointment-details .patient-list .patient-container .user-icon

.appointments .appointment-details.active .appointment-details-card .appointment-details .appointment-input input 
{
    text-align: center;
    width: 100%;

    font-size: 16px;
    font-family: "Inter";
    border-radius: 0;
}

.appointments .appointment-details.active .appointment-details-card .appointment-details .appointment-input .scale
{
    background: var(--contrast-color);

    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    
}

.appointments .appointment-details.active .appointment-details-card .appointment-details .appointment-input .scale-left 
{
    border-top-left-radius: 8px;
    border-bottom-left-radius: 8px;
}

.appointments .appointment-details.active .appointment-details-card .appointment-details .appointment-input .scale-right 
{
    border-top-right-radius: 8px;
    border-bottom-right-radius: 8px;
}

.appointments .appointment-details.active .appointment-details-card .appointment-details .label textarea
{
    width: 100%;

    outline: none;
    background: rgba(0, 0, 0, .2);
    resize: vertical;
    padding: .75rem;
    font-size: 16px;

.appointments .appointment-details.active .appointment-details-card .appointment-details .label
{
    color: var(--text-color);
}

.appointments .appointment-details.active .appointment-details-card .add-appointment

    width: 100%;
    max-width: 90%;

    justify-content: center;
    align-items: center;
    background: var(--contrast-color);
    border: none;
    outline: none;
    border-radius: 24px;
    cursor: pointer;

.appointments .appointment-details.active .appointment-details-card .add-appointment p
{
    color: var(--text-color);
    font-size: 18px;

}

.content .options .option

    display: flex;

.content .options .option p

    color: var(--text-color);

}

{
    display: flex;
    
 
    height: 100vh;
}


.input input::-webkit-outer-spin-button,
.input input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

/* Firefox */
.input input[type=number] {
  -moz-appearance: textfield;
}

input[type=date] {
    color-scheme: dark;
}

.create-patient h2.title
{
    margin: calc(10vh + 2rem) auto 2rem;
    color: var(--text-color);
    font-size: 40px;
}

.form 
{
    width: 100%;
    display: grid;
    grid-template-columns: auto auto;
    justify-content: center;
   
    column-gap: 5rem;
    row-gap: 1.5rem;
}

.form .info 
{
    grid-column: 1 / -1;
    font-size: 30px;
    color: var(--text-color);
    display: flex;
    align-items: center;
    gap: 1rem;
}

.form .info .option-icon 
{
    cursor: pointer;
    transition: all 350ms ease-in-out;
}

.form .info .option-icon.active 
{
    transform: rotateZ(180deg);
} 

.form .input 
{
    
    display: flex;
    flex-direction: column;
   
}

.form .input:not(.no-bg) input
{

   width: 300px;
 
   border: 1px solid rgba(255, 255, 255, .1);
   outline: none;
   background: rgba(255, 255, 255, .025);
   height: 40px;
   border-radius: 10px;
   font-family: 'Inter';
   color: var(--text-color);
   padding-left: 1rem;
}

.form .input > p
{
    color: var(--text-color);
    font-weight: 600;
    font-size: 18px;
    margin-left: 5px;
}

.form .input textarea 
{
    resize: vertical;
    border: 1px solid rgba(255, 255, 255, .1);
    outline: none;
    background: rgba(255, 255, 255, .025);
    min-height: 100px;
    color: var(--text-color);
    border-radius: 10px;
    padding: 1rem;
    font-size: 16px;
}

.form button 
{
    grid-column: 1 / -1;
    width: calc(100% + 1rem);
    height: 50px;
    margin: 2rem auto;
    cursor: pointer;
    border: none;
    outline: none;
    background: var(--contrast-color);
    border-radius: 50px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0 1rem;
    font-size: 20px;
    color: var(--text-color);
    font-weight: 600;
    font-family: "Source Sans Pro";
}

.form .options 
{
    display: grid;
    justify-content: space-between;
    grid-template-columns: 1fr 1fr 1fr;
    align-items: center;
    margin-left: 5px;
}

.form .options .option
{
    display: flex;
    gap: .5rem;
    align-items: center;
    
}

.form .options .option .circle
{
    width: 20px;
    height: 20px;
    border: 1px solid var(--text-color);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
}

.form .options .option .circle .active-icon 
{
    opacity: 0;
    font-size: 15px;
    color: var(--contrast-color);
}

.form .options .option.active .circle .active-icon
{
    opacity: 1;
}

.form .options p 
{
    color: var(--text-color);

{
    margin-top: 10vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin-bottom: 4rem;
}

.patient-account-details h2.title 
{
    color: var(--text-color);
    font-size: 40px;
}

.patient-account-details .inputs-container 
{
    display: grid;
    grid-column-gap: 2.5rem;
    grid-row-gap: 1.5rem;
    margin-bottom: 2rem;
    grid-template-columns: 1fr 1fr;
}

.patient-account-details .inputs-container .input 
{
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.patient-account-details .inputs-container .input input 
{
    width: 300px;
    border: 1px solid rgba(255, 255, 255, .1);
    outline: none;
    background: rgba(255, 255, 255, .025);
    height: 40px;
    border-radius: 10px;
    font-family: 'Inter';
    color: var(--text-color);
    padding-left: 1rem;
   
}

.patient-account-details .input textarea 
{
    width: 100%;
    max-width: 300px;
    resize: vertical;
    border: 1px solid rgba(255, 255, 255, .1);
    outline: none;
    background: rgba(255, 255, 255, .025);
    min-height: 100px;
    color: var(--text-color);
    border-radius: 10px;
    padding: 1rem;
    font-size: 16px;
}

.patient-account-details .input-title
{
    display: flex;
    width: 100%;
    max-width: 300px;
    align-items: center;
    gap: .75rem;
    
    
}


.patient-account-details .input-title p 
{
    font-family: "Source Sans Pro";
    font-weight: 400;
    color: var(--text-color);
    font-size: 18px;
}

.content .options .option p.patient-gender
{
    font-size: 16px;
    text-align: center;
    
}

.patient-account-details .input-title .icon 
{
    color: rgba(255, 255, 255, .3);
    font-size: 18px;
}

.patient-account-details .input .options 
{
    display: grid;
    justify-content: space-between;
    grid-template-columns: 1fr 1fr 1fr;
    align-items: center;
   
}

.patient-account-details .options .option
{
    display: flex;
    gap: .5rem;
    align-items: center;
    color: var(--text-color);
    justify-content: center;
}

.patient-account-details .options .option .circle
{
    width: 20px;
    height: 20px;
    border: 1px solid var(--text-color);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
}

.patient-account-details .options .option .circle .active-icon 
{
    opacity: 0;
    font-size: 15px;
    color: var(--contrast-color);
    transition: all 250ms ease-in-out;
}

.patient-account-details .options .option.active .circle .active-icon
{
    opacity: 1;
}

.patient-account-details button 
{
    grid-column: 1 / -1;
    width: 100%;
    height: 45px;
    background: var(--contrast-color);
    margin-top: 2rem;
    border-radius: 1.5rem;
    border: none;
    outline: none;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transition: all 350ms ease-in-out;
}

.patient-account-details button p
{
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    font-family: "Source Sans Pro";
}

.patient-account-details button.active
{
    opacity: 1;
    animation-delay: 350ms;
    animation-name: update_btn;
    animation-duration: 400ms;
    animation-iteration-count: 1;
}

.patient-historic .title
{
    text-align: center;
    color: var(--text-color);
    font-size: 40px;
}

.patient-historic .historic-container
{
    width: 100%;
    max-width: 90%;
    background: var(--dark-color);
    margin: 0 auto 2rem;
    box-shadow: 0 0 10px var(--text-color-3);
    border-radius: 10px;
    padding: 1rem;
}

.patient-historic .historic-container .first-row 
{
    
    width: 100%;
    
    display: flex;
    background: var(--contrast-color);
    border-radius: 28px;
    justify-content: space-between;
    padding: .75rem 0;
    margin: .5rem auto 1rem;
    
}

.patient-historic .historic-container .first-row .col 
{
    font-size: 20px;
    color: var(--text-color-2);
    text-align: center;
    flex: 1 1;
    
}

.patient-historic .historic-container .historic-item 
{
    border-bottom: 1px solid var(--text-color-4);
    display: flex;
    
    margin: .5rem auto;
    justify-content: space-between;
    
    padding: .5rem 0;
}

.patient-historic .historic-container .historic-item .col
{
    text-align: center;
    flex: 1 1;
    color: var(--text-color-2);
    font-size: 20px;
    
}

@keyframes update_btn {
    33% {
        transform: rotateZ(-5deg);
    }

    66% {
        transform: rotateZ(5deg);
    }

    100% {
        transform: rotateZ(initial);

{
    font-size: 40px;
    margin: 20vh auto 2rem;
    color: var(--text-color);
    text-align: center;
}

.settings .content .inputs-container
{
    padding-inline: 2rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
   
}

.settings .content .inputs-container > div 
{
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    row-gap: 1.5rem;
}

.settings .row
{
    display: flex;
    justify-content: center;
    gap: .5rem;
    align-items: center;
    width: calc(100% - 1rem);
    height: 60px;
    border: 2px solid var(--over-difference-color);
   
    padding-inline: .5rem;
}

.settings .inputs-container > div:first-child .row
{
    border-right: none;
}

.settings .row .circle
{
    width: 25px;
    height: 25px;
    border-radius: 50%;
    margin-inline: .5rem;
}

.settings .row > span 
{
    background: transparent;
    border: none;
 
    display: flex;
    justify-content: center;
    align-items: center;
    width: calc(100% + 1rem);
    height: 100%;
}

.settings .row > span span 
{
 
  
   
}

.settings .row p 
{
    font-size: 24px;
    color: var(--text-color);
    
}

.settings .changes-btn 
{
    width: 80%;
    height: 40px;
    background: var(--contrast-color);
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 2rem auto;
    border: none;
    outline: none;
    border-radius: 24px;
    cursor: pointer;
    font-size: 24px;
    font-family: "Source Sans Pro";
    color: var(--text-color);
    transition: all 400ms ease-in-out;
}

.settings .changes-btn:hover 
{
    box-shadow: 0px 0px 5px var(--contrast-color);
}

.settings .hue-horizontal 
{

.doctor-schedule .schedule-container .schedules .day-container.first-active 
{
    border-top-left-radius: 10px;
}

.doctor-schedule .schedule-container .schedules .day-container:last-child 
{   
    border-bottom-right-radius: 10px;
}

.doctor-schedule .schedule-container .schedules .day-container:nth-child(7)
{
    border-top-right-radius: 10px;
}

.doctor-schedule .schedule-container .schedules .day-container:nth-child(29)
{
    border-bottom-left-radius: 10px;
}

/* .doctor-schedule .schedule-container .schedules .day-container:nth-child(28)
{
    border-bottom-right-radius: 10px;
} */


.doctor-schedule .schedule-container .schedules.grid-5 .day-container:last-child 
{
    border-top-right-radius: 10px;
}

.doctor-schedule .schedule-container .schedules.grid-5 .day-container:first-child 
{
    border-bottom-left-radius: 10px;
}

.doctor-schedule .schedule-container .schedules .day-container .first-row 
{
    display: flex;
    justify-content: space-between;
    padding: 0px 14px;
    margin: -10px 0;
}


.doctor-schedule .schedule-container .schedules .day-container .first-row .edit-icon 
{
    font-size: 20px;
    color: var(--text-color-3);
    cursor: pointer;
    transition: all 350ms ease-in-out;
}

.doctor-schedule .schedule-container .schedules .day-container .first-row .edit-icon:hover 
{
    color: var(--text-color-2);
}

.doctor-schedule .schedule-container .schedules .day-container .first-row .day 
{
    font-size: 24px;
    color: var(--text-color);
} 

.doctor-schedule .schedule-container .schedules .day-container .schedule-card 
{
    width: 95%;
    
    margin: .25rem auto 1rem;
    padding: .25rem 0;
    border-radius: 15px;
    cursor: pointer;
    transition: all 350ms ease-in-out;
}

.doctor-schedule .schedule-container .schedules .day-container .schedule-card:hover 
{
    filter: brightness(0.8);
}

.doctor-schedule .schedule-container .schedules .day-container .schedule-card p 
{
    color: var(--text-color);
    font-size: 17px;
    text-overflow: ellipsis; 
    text-align: center;
    overflow: hidden; 
    margin: 0;
}

.doctor-schedule .schedule-container .schedules .day-container .schedule-card p.name 
{
    font-weight: bold;
}

{
    display: flex;
    justify-content: center;
    align-items: center;
    width: 90%;
    margin: 0 auto;
    height: 300px;
    background: var(--dark-color);
    border-radius: 20px;
    box-shadow: 0 0 10px var(--contrast-color);
}

.no-schedules h2 
{
    color: var(--text-color);
    font-size: 40px;
}

.save-button 
{
    opacity: 0;
    -webkit-user-select: none;
            user-select: none;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 90%;
    margin: 2rem auto;
    
    border-radius: 30px;
    border: none;
    outline: none;
    background: var(--contrast-color);
    transition: all 400ms ease-in-out;
}

.save-button.show 
{
    opacity: 1;
    -webkit-user-select: initial;
            user-select: initial;
    cursor: pointer;
}

.save-button p 
{
    font-size: 24px;
    color: var(--text-color);
    font-family: "Source Sans Pro";
    margin: .75rem 0;
}

.schedule 
{
    display: grid;
    justify-content: center;
    align-items: center;
    width: 90%;
    margin: 0 auto;
    gap: 1rem;
    grid-template-columns: 1.5fr .5fr .5fr .5fr .5fr 1.5fr;
 
}



.schedule .input textarea 
{
    height: min-content;
    resize: vertical;
}

.schedule .input input,
.schedule .input textarea
{
    border: none;
    outline: none;
    background: var(--dark-color);
    border: 1px solid var(--contrast-color);
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--text-color);
    font-family: "Source Sans Pro";
    padding-inline: .5rem;
}

.schedule .input textarea
{
   
    font-size: 18px;
    font-family: "Source Sans Pro";
    width: 100%;
    height: 30px;
    min-height: 30px;
}

.schedule .input .time-input 
{
    width: 50px;
    height: 35px;
